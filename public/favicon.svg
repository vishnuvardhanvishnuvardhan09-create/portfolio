<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35e0ff"/>
      <stop offset="100%" stop-color="#00a8d6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1f2d4f" stroke-width="2"/>

  <!-- PCB Traces -->
  <path d="M12 24 L20 24 L24 20" stroke="#35e0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M52 24 L44 24 L40 20" stroke="#35e0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M12 40 L20 40 L24 44" stroke="#ffb454" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M52 40 L44 40 L40 44" stroke="#35e0ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- IC Package Body -->
  <rect x="20" y="20" width="24" height="24" rx="4" fill="#070c18" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Pin 1 Dot -->
  <circle cx="25" cy="25" r="1.5" fill="#ffb454"/>

  <!-- Central Die Silicon Core -->
  <rect x="27" y="27" width="10" height="10" rx="1.5" fill="#141f38" stroke="#35e0ff" stroke-width="1"/>
  <path d="M32 29 L32 35 M29 32 L35 32" stroke="#35e0ff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- IC Pins Top / Bottom -->
  <line x1="24" y1="17" x2="24" y2="20" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="17" x2="32" y2="20" stroke="#ffb454" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="17" x2="40" y2="20" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>

  <line x1="24" y1="44" x2="24" y2="47" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="47" stroke="#35e0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="44" x2="40" y2="47" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>

  <!-- IC Pins Left / Right -->
  <line x1="17" y1="24" x2="20" y2="24" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="32" x2="20" y2="32" stroke="#35e0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="17" y1="40" x2="20" y2="40" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>

  <line x1="44" y1="24" x2="47" y2="24" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="47" y2="32" stroke="#ffb454" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="40" x2="47" y2="40" stroke="#a0b8d4" stroke-width="2" stroke-linecap="round"/>
</svg>
